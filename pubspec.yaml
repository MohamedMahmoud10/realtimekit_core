name: realtimekit_ui
description: Cloudflare's RealtimeKit UI SDK to integrate video-audio to your app
version: 0.2.0
homepage: https://docs.realtime.cloudflare.com/
environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=1.17.0"
dependencies:
  flutter:
    sdk: flutter
  realtimekit_core:
    git:
      url: https://github.com/MohamedMahmoud10/realtimekit_core
      ref: feat/V0.1.4+1
  get_it: ^9.0.5
  flutter_riverpod: ^2.1.3
  file_picker: ^9.2.1
  dyte_icons: 0.0.3
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  assets:
    - pubspec.yaml
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

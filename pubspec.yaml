name: realtimekit_ui
description: Cloudflare's RealtimeKit UI SDK to integrate video-audio to your app
version: 0.4.0
homepage: https://docs.realtime.cloudflare.com/
environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=1.17.0"
dependencies:
  flutter:
    sdk: flutter
  # Patched core: transitively pulls the android plugin carrying the
  # rejoin/first-join stuck-loading fixes, including the EventChannel
  # onCancel null-client crash fix. See branch rejoin-stuck-loading-oncancel-core.
  realtimekit_core:
    git:
      url: https://github.com/MohamedMahmoud10/realtimekit_core.git
      ref: android-only-core
  get_it: ^9.0.5
  flutter_riverpod: ^2.1.3
  file_picker: ^10.3.8
  dyte_icons: ^0.0.3
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  melos: ^7.0.0

melos:
  useRootAsPackage: true

flutter:
  assets:
    - pubspec.yaml
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

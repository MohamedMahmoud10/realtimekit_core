name: realtimekit_core
description: Realtimekit Core SDK
version: 0.1.4+1
homepage: https://docs.realtime.cloudflare.com/flutter-core

environment:
  sdk: ">=2.19.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  realtimekit_core_android:
    git:
      url: https://github.com/MohamedMahmoud10/realtimekit_core
      ref: feat/android-version
  realtimekit_core_platform_interface:
    git:
      url: https://github.com/MohamedMahmoud10/realtimekit_core
      ref: feat/platform_interface
  pubspec_parse: ^1.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: realtimekit_core_android
  assets:
    - pubspec.yaml